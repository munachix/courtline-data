name: publish
# Copies Courtline's public data to the "data" branch every 5 minutes so the
# app can read them through jsDelivr where the main server is blocked (e.g. China).
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch public data
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          mkdir out
          FROM=$(TZ=America/New_York date -d '-7 day' +%F)
          TO=$(TZ=America/New_York date -d '+7 day' +%F)
          get() { curl -fsS --retry 3 --max-time 60 "$URL/functions/v1/$1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -o "out/$2"; }
          get "api/v1/snapshot?from=$FROM&to=$TO" snapshot.json
          get "api/v1/all-games" allgames.json
          get "community/team-outlooks" outlooks.json
          get "community/power" power.json
          get "community/race" race.json
          get "community/articles" articles.json
          get "community/leaderboard" leaderboard.json
          python3 -c "import json,glob; [json.load(open(f)) for f in glob.glob('out/*.json')]"
      - name: Publish (one commit, data branch)
        run: |
          set -euo pipefail
          cd out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "data $(date -u +%FT%TZ)"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
      - name: Refresh the CDN copy
        run: |
          for f in snapshot allgames outlooks power race articles leaderboard; do
            curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@data/$f.json" > /dev/null || true
          done
